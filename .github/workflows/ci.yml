name: CI Pipeline

on:
  push:
    branches: [ main, develop ] # Déclenche sur push vers main ou develop
  pull_request:
    branches: [ main, develop ] # Déclenche sur PR vers main ou develop

jobs:
  lint:
    name: Run Linters
    runs-on: ubuntu-latest # Utilise un runner Ubuntu

    strategy:
      matrix:
        python-version: ['3.10'] # Spécifiez votre version Python
        node-version: [18.x]    # Spécifiez votre version Node.js

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Backend Linting
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install backend dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black fastapi uvicorn # Ajoutez d'autres dépendances backend si nécessaire

    - name: Lint with Flake8 (Backend)
      working-directory: ./backend
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: Check formatting with Black (Backend)
      working-directory: ./backend
      run: |
        black . --check

    # Frontend Linting
    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci # Utilise npm ci pour une installation plus rapide et reproductible

    - name: Lint with ESLint (Frontend)
      working-directory: ./frontend
      run: npm run lint

    - name: Check formatting with Prettier (Frontend)
      working-directory: ./frontend
      run: npm run format -- --check # Ajoute --check pour ne pas modifier les fichiers